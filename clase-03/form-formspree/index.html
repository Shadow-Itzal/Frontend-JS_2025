<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario direccionado a Formspree</title>
</head>
<body>

    <h1>Formulario direccionado a Formspree</h1>

    <form action="" method="POST"><!-- en action copiar/pegar la url de formspree mia  -->
        <label for="name">Nombre:</label>
            <input type="text" name="name" id="name" placeholder="Ingrese su nombre" required>
        <br>
        <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="Ingrese su email">
        
        <br>
        <label for="mensaje">
            <textarea name="mensaje" id="mensaje" rows="4" cols="50" placeholder="Ingrese su mensaje"></textarea>
        </label>
        <br>
        <button type="submit">Enviar</button>
        <!-- boton para limpiar -->
        <button type="reset">Limpiar</button>
    </form>


    
</body>
</html>
